[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shieldnet"
version = "1.0.0"
description = "Calibrated multi-evidence URL threat analysis service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "flask>=2.0,<4",
  "flask-socketio>=5.0,<6",
  "h5py>=3.12,<3.15",
  "imagehash>=4.3,<5",
  "joblib>=1.0,<2",
  "keras>=3.12,<4",
  "numpy>=2,<3",
  "pandas>=1.3,<3",
  "pillow>=11,<13",
  "playwright>=1.50,<2",
  "psutil>=5.9,<7",
  "pydantic>=2.10,<3",
  "requests>=2.32,<3",
  "scikit-learn==1.9.0",
  "scipy>=1.14,<2",
  "tensorflow>=2.21,<2.22",
  "tldextract>=5.1,<6",
  "urllib3>=2.2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
visual = []  # playwright is a base dependency; kept as an empty alias for compatibility
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
shieldnet = "main:main"

[tool.setuptools]
py-modules = ["config", "main"]

[tool.setuptools.packages.find]
include = ["api*", "ml_engine*", "pipeline*", "integrations*", "netguard*"]

[tool.setuptools.package-data]
ml_engine = ["saved_model/*.keras", "saved_model/*.json"]
"integrations.browser_extension" = ["*.json", "*.js", "*.html", "*.css", "*.md"]
netguard = ["models/*.pkl", "models/*.h5", "dashboard/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 105
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
